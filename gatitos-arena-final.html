 if(!bot){const o=look();s.b=o.b;s.p=o.p;s.e=o.e}for(let i=0;i<nseg(s);i++)s.segs.push({x:q.x-i*3*Math.cos(s.a),y:q.y-i*3*Math.sin(s.a)});return s}

function kill(s,by){if(s.dead)return;s.dead=1;const v=Math.max(1,Math.round(s.len/Math.max(1,s.segs.length)*1.6));for(let i=0;i<s.segs.length;i+=2)G.food.push({x:s.segs[i].x+rnd(-8,8),y:s.segs[i].y+rnd(-8,8),col:FC[ri(6)],v,r:9});
 if(by){by.kills++;if(by===G.p)toast('¡Atrapaste a '+s.name+'! +5')}if(s===G.p)end();else G.bots[G.bots.indexOf(s)]=mkSnake(1,rnd(12,35))}
function end(){G.over=1;const g=Math.floor(G.p.len/3)+G.p.kills*5;S.fish+=g;S.best=Math.max(S.best,Math.floor(G.p.len));save();$('#ot').innerHTML=`${S.name} se cayó 😿<br>Largo: ${Math.floor(G.p.len)} · Atrapados: ${G.p.kills}<br>Ganaste +${g} ${FSH}`;$('#over').style.display='flex'}

function aiSteer(b,all){const r=rad(b);let res={ta:b.a,bo:0};
 const hit=(da)=>{const L=r*5+70,ax=b.x+Math.cos(b.a+da)*L,ay=b.y+Math.sin(b.a+da)*L;if(Math.hypot(ax,ay)>R-110)return 1;for(const o of all){if(o===b||o.dead)continue;if(Math.hypot(o.x-ax,o.y-ay)>o.segs.length*rad(o)*.8+r+60)continue;for(let i=0;i<o.segs.length;i+=2)if(Math.hypot(o.segs[i].x-ax,o.segs[i].y-ay)<rad(o)*1.1+r)return 1}return 0};
 if(hit(0)){res.ta=b.a+(!hit(.7)?1.3:!hit(-.7)?-1.3:1.8);return res}
 for(const o of all){if(o===b)continue;const d=Math.hypot(o.x-b.x,o.y-b.y);if(o.len>b.len*1.25&&d<r*9+140){res.ta=Math.atan2(b.y-o.y,b.x-o.x);res.bo=d<r*5+80&&b.len>20;return res}}
 let tg=null,bd=700;for(const o of all){if(o===b||o.dead||o.len>b.len*.92&&!(o===G.p&&b.len>o.len*.7))continue;const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<bd){bd=d;tg=o}}
 if(tg&&b.ag>.45&&b.len>16){const lead=Math.min(260,bd*.7);res.ta=Math.atan2(tg.y+Math.sin(tg.a)*lead-b.y,tg.x+Math.cos(tg.a)*lead-b.x);res.bo=bd<420&&b.len>26;return res}
 let bf=null,bs=0;for(const f of G.food){const d=Math.hypot(f.x-b.x,f.y-b.y);if(d>520)continue;const sc2=f.v*f.v/(d+50);if(sc2>bs){bs=sc2;bf=f}}
 res.ta=bf?Math.atan2(bf.y-b.y,bf.x-b.x):b.a+Math.sin(G.t*.8+b.x)*.25;return res}
function stepSnake(s,dt,ta,bo){let d=ta-s.a;d=Math.atan2(Math.sin(d),Math.cos(d));s.a+=cl(d,-4.2*dt,4.2*dt);
 const free=s.pw[0]>0;const sp=BASE*Math.pow(1+s.len/700,-.12)*(free?1.35:1)*(bo?1.75:1);const h=s.segs[0];h.x+=Math.cos(s.a)*sp*dt;h.y+=Math.sin(s.a)*sp*dt;
 if(bo&&!free&&s.len>12){s.len-=6*dt;if(Math.random()<dt*8)G.food.push({x:h.x-Math.cos(s.a)*20,y:h.y-Math.sin(s.a)*20,col:'#ffd23f',v:1,r:5})}
 const n=nseg(s),sc2=rad(s)*.72;while(s.segs.length<n)s.segs.push({...s.segs[s.segs.length-1]});s.segs.length=n;
 for(let i=1;i<n;i++){const a=s.segs[i-1],b=s.segs[i],dx=a.x-b.x,dy=a.y-b.y,dd=Math.hypot(dx,dy);if(dd>sc2){b.x=a.x-dx/dd*sc2;b.y=a.y-dy/dd*sc2}}s.x=h.x;s.y=h.y;for(const k in s.pw)if(s.pw[k]>0)s.pw[k]-=dt}

 stepSnake(p,dt,Math.atan2(dy,dx),boost||keys[' ']);
 for(const b of G.bots){const r=aiSteer(b,all);stepSnake(b,dt,r.ta,r.bo)}

  for(let i=G.food.length-1;i>=0;i--){const f=G.food[i],q=Math.hypot(f.x-s.x,f.y-s.y);if(mg&&q<mg&&q>r){f.x+=(s.x-f.x)*dt*7;f.y+=(s.y-f.y)*dt*7}if(q<r+14){s.len+=f.v*.8*(s.pw[3]>0?2:1);G.food.splice(i,1)}}
  if(s===p)for(let i=G.pups.length-1;i>=0;i--){const u=G.pups[i];if(Math.hypot(u.x-s.x,u.y-s.y)<r+24){p.pw[u.k]=u.k==3?10:7;toast(PW[u.k][1]);G.pups[i]={...pos(),k:ri(4)}}}}

   if(Math.hypot(o.x-s.x,o.y-s.y)<(rad(o)+rad(s))*.7){if(s.len<=o.len&&!(s===p&&p.pw[2]>0)){kill(s,o);if(G.over)return}continue}
   if(Math.hypot(o.x-s.x,o.y-s.y)>o.segs.length*rad(o)*.75+lim)continue;
